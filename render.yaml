# Render blueprint: one web service and one Postgres database.
# In Render: New > Blueprint, pick this repository, then fill in the values marked "sync: false".
services:
  - type: web
    name: outwork
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: outwork-db
          property: connectionString
      - key: APP_URL          # the public address, for example https://outwork.onrender.com
        sync: false
      - key: BREVO_API_KEY    # from Brevo: SMTP and API > API Keys
        sync: false
      - key: MAIL_FROM_EMAIL  # a sender address verified in Brevo
        sync: false
      - key: MAIL_FROM_NAME
        value: Outwork

databases:
  - name: outwork-db
    databaseName: outwork
    user: outwork
